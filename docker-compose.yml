version: "3.9"

services:
  postgres:
    image: postgres:14
    container_name: tinyurl_postgres
    restart: always
    environment:
      POSTGRES_DB: tinyurl
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  tinyurl:
    build: .
    container_name: tinyurl_app
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tinyurl
      SPRING_DATASOURCE_USERNAME: username
      SPRING_DATASOURCE_PASSWORD: password
      APP_BASE_URL: https://tiny.fyv.dev
    ports:
      - "8080:8080"

volumes:
  pgdata:
